<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movie App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with the app name -->
  <header>
    <span class="icon" aria-hidden="true">🎞️</span>
    <h1>My Movie App</h1>
    <span class="icon" aria-hidden="true">🎬</span>
  </header>

  <main>
    <!-- Message box -->
    <div id="msg"></div>

    <!-- Search and sort -->
    <section>
      <h2>Movie Search/Sort</h2>

      <div class="search-row">
        <label for="searchTitle" class="hidden-label">Movie name</label>
        <input type="text" id="searchTitle" placeholder="Movie Name...">

        <label for="searchId" class="hidden-label">Movie ID</label>
        <input type="number" id="searchId" placeholder="Movie ID...">

        <p id="searchResult">Search outcome will show here</p>
      </div>

       <div class="button-row">
      <button type="button" id="searchBtn">Search Name</button>
      <button type="button" id="searchIdBtn">Search ID</button>

      <!-- Sort buttons move to right -->
      <div class="sort-buttons">
        <button type="button" id="sortA2ZBtn">Sort (A-Z)</button>
        <button type="button" id="sortZ2ABtn">Sort (Z-A)</button>
        <button type="button" id="bestBtn">Best Movies</button>
      </div>
    </div>
    </section>

    

    <!-- Movie list -->
    <section>
      <h2>Movie List</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Year</th>
            <th>Rating</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
      <button type="button" id="refreshBtn">Refresh</button>
    </section>

    <!-- Add, update and delete movies -->
    <section class="maintenance">
      <div class="mode-row">
        <button type="button" class="mode active" id="addMode">Add Movie</button>
        <button type="button" class="mode" id="updateMode">Update Movie</button>
        <button type="button" class="mode" id="deleteMode">Delete Movie</button>
      </div>

      <form id="movieForm" onsubmit="return false">
        <label for="movieId">ID:</label>
        <input type="number" id="movieId">

        <label for="title">Title:</label>
        <input type="text" id="title">

        <label for="year">Year:</label>
        <input type="number" id="year">

        <label for="rating">Rating:</label>
        <input type="number" id="rating" min="1" max="10" step="0.1" placeholder="1 to 10">

        <button type="button" id="enterBtn">Add Movie</button>
        </form>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="date"></span> Mathew Brown</p>
  </footer>

  <!-- Loading other scripts -->
  <script src="movieList.js"></script>
  <script src="app.js"></script>
</body>
</html>
